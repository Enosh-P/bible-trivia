    <!-- cover -->
    <path d="M86 214 Q86 200 100 200 L256 222 L412 200 Q426 200 426 214 L426 392 Q426 404 414 404 L256 416 L98 404 Q86 404 86 392 Z" fill="#e0493e"/>
