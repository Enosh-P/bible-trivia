  <!-- face -->
  <circle cx="190" cy="292" r="15" fill="#1d2430"/><circle cx="196" cy="286" r="5" fill="#fff"/>
  <circle cx="322" cy="292" r="15" fill="#1d2430"/><circle cx="328" cy="286" r="5" fill="#fff"/>
