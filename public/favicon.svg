  <path d="M228 320 Q256 350 284 320" fill="none" stroke="#1d2430" stroke-width="11" stroke-linecap="round"/>
  <!-- question bubble -->
  <g stroke="#1d2430" stroke-width="12" stroke-linejoin="round">
    <path d="M364 62 C410 62 444 92 444 132 C444 172 410 200 364 200 C352 200 341 198 331 194 L300 212 L308 180 C292 166 284 150 284 132 C284 92 318 62 364 62 Z" fill="#ffffff"/>
  </g>
  <path d="M342 112 C342 96 354 88 366 88 C380 88 390 98 390 110 C390 124 376 128 370 138 L368 148" fill="none" stroke="#1e8a5a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
